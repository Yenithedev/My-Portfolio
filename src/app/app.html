<div
  [class]="
    'min-h-screen transition-colors duration-300 ' +
    (dark ? 'bg-slate-950 text-white' : 'bg-white text-slate-900')
  "
>
  <!-- ================= NAVBAR ================= -->
  <app-navbar [dark]="dark" (toggleTheme)="onToggleTheme()"></app-navbar>
  <!-- ================= HERO ================= -->
  <main id="home">
    <app-hero-section [dark]="dark"></app-hero-section>
    <!-- ================= ABOUT ================= -->
    <app-about-section [dark]="dark"></app-about-section>
    <!-- ================= SKILLS ================= -->
    <app-skills [dark]="dark"></app-skills>
    <!-- ================= PROJECTS ================= -->
    <app-projects [dark]="dark"></app-projects>

    <!-- ================= CONTACT ================= -->
    <app-contact-section [dark]="dark"></app-contact-section>
  </main>

  <!-- ================= FOOTER ================= -->
  <app-footer [dark]="dark"></app-footer>
</div>
