<footer [class]="'border-t ' + (dark ? 'border-white/10' : 'border-slate-200')">
  <div
    [class]="
      'mx-auto flex max-w-6xl flex-col gap-4 px-6 py-8 text-sm sm:flex-row sm:items-center sm:justify-between ' +
      (dark ? 'text-slate-400' : 'text-black')
    "
  >
    <p>© 2026 Adeyeni Salau. All rights reserved.</p>

    <div class="flex flex-wrap items-center gap-3 font-mono">
      <!-- Phone -->
      <a
        href="tel:+2349024542005"
        aria-label="Call phone number"
        [class]="
          'flex h-10 w-10 items-center justify-center rounded-full border transition ' +
          (dark
            ? 'border-white/10 hover:border-cyan-400 hover:text-cyan-400'
            : 'border-slate-200 hover:border-cyan-600 hover:text-cyan-600')
        "
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"
          />
        </svg>
      </a>

      <!-- Email -->
      <a
        href="mailto:adeyenisalau@gmail.com"
        aria-label="Send an email"
        [class]="
          'flex h-10 w-10 items-center justify-center rounded-full border transition ' +
          (dark
            ? 'border-white/10 hover:border-cyan-400 hover:text-cyan-400'
            : 'border-slate-200 hover:border-cyan-600 hover:text-cyan-600')
        "
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
          />
        </svg>
      </a>

      <!-- Instagram -->
      <a
        href="https://instagram.com/yenithedev"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram"
        [class]="
          'flex h-10 w-10 items-center justify-center rounded-full border transition ' +
          (dark
            ? 'border-white/10 hover:border-cyan-400 hover:text-cyan-400'
            : 'border-slate-200 hover:border-cyan-600 hover:text-cyan-600')
        "
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="3" y="3" width="18" height="18" rx="5" ry="5" />
          <path d="M16 11.37a4 4 0 11-7.914 1.174A4 4 0 0116 11.37z" />
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" />
        </svg>
      </a>

      <!-- X -->
      <a
        href="https://x.com/yenithedev"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="X"
        [class]="
          'flex h-10 w-10 items-center justify-center rounded-full border transition ' +
          (dark
            ? 'border-white/10 hover:border-cyan-400 hover:text-cyan-400'
            : 'border-slate-200 hover:border-cyan-600 hover:text-cyan-600')
        "
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          fill="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"
          />
        </svg>
      </a>
    </div>
  </div>
</footer>
