<section id="skills" [class]="'border-t ' + (dark ? 'border-white/10' : 'border-slate-200')">
  <div class="mx-auto max-w-6xl px-6 py-24">
    <p
      [class]="
        'font-mono text-sm uppercase tracking-widest ' + (dark ? 'text-cyan-400' : 'text-cyan-600')
      "
    >
      My Stack
    </p>

    <h2 [class]="'mt-3 text-4xl font-bold ' + (dark ? 'text-white' : 'text-black')">
      Technologies I work with
    </h2>

    <div class="mt-12 grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4">
      <!-- HTML -->
      <div
        [class]="
          'rounded-2xl border p-6 transition hover:-translate-y-1 hover:border-cyan-400 ' +
          (dark
            ? 'border-white/10 bg-white/5 hover:shadow-none'
            : 'border-slate-200 bg-slate-50 hover:shadow-lg')
        "
      >
        <p [class]="'text-lg font-semibold ' + (dark ? 'text-white' : 'text-black')">HTML</p>
        <p [class]="'mt-2 text-sm ' + (dark ? 'text-slate-400' : 'text-black')">
          Structure & Semantics
        </p>
      </div>

      <!-- CSS -->
      <div
        [class]="
          'rounded-2xl border p-6 transition hover:-translate-y-1 hover:border-cyan-400 ' +
          (dark
            ? 'border-white/10 bg-white/5 hover:shadow-none'
            : 'border-slate-200 bg-slate-50 hover:shadow-lg')
        "
      >
        <p [class]="'text-lg font-semibold ' + (dark ? 'text-white' : 'text-black')">CSS</p>
        <p [class]="'mt-2 text-sm ' + (dark ? 'text-slate-400' : 'text-black')">
          Styling & Responsive Design
        </p>
      </div>

      <!-- JavaScript -->
      <div
        [class]="
          'rounded-2xl border p-6 transition hover:-translate-y-1 hover:border-cyan-400 ' +
          (dark
            ? 'border-white/10 bg-white/5 hover:shadow-none'
            : 'border-slate-200 bg-slate-50 hover:shadow-lg')
        "
      >
        <p [class]="'text-lg font-semibold ' + (dark ? 'text-white' : 'text-black')">JavaScript</p>
        <p [class]="'mt-2 text-sm ' + (dark ? 'text-slate-400' : 'text-black')">
          Logic & Interactivity
        </p>
      </div>

      <!-- TypeScript -->
      <div
        [class]="
          'rounded-2xl border p-6 transition hover:-translate-y-1 hover:border-cyan-400 ' +
          (dark
            ? 'border-white/10 bg-white/5 hover:shadow-none'
            : 'border-slate-200 bg-slate-50 hover:shadow-lg')
        "
      >
        <p [class]="'text-lg font-semibold ' + (dark ? 'text-white' : 'text-black')">TypeScript</p>
        <p [class]="'mt-2 text-sm ' + (dark ? 'text-slate-400' : 'text-black')">
          Type-safe Programming
        </p>
      </div>

      <!-- Angular -->
      <div
        [class]="
          'rounded-2xl border p-6 transition hover:-translate-y-1 hover:border-cyan-400 ' +
          (dark
            ? 'border-white/10 bg-white/5 hover:shadow-none'
            : 'border-slate-200 bg-slate-50 hover:shadow-lg')
        "
      >
        <p [class]="'text-lg font-semibold ' + (dark ? 'text-white' : 'text-black')">Angular</p>
        <p [class]="'mt-2 text-sm ' + (dark ? 'text-slate-400' : 'text-black')">
          Frontend Framework
        </p>
      </div>

      <!-- Tailwind CSS -->
      <div
        [class]="
          'rounded-2xl border p-6 transition hover:-translate-y-1 hover:border-cyan-400 ' +
          (dark
            ? 'border-white/10 bg-white/5 hover:shadow-none'
            : 'border-slate-200 bg-slate-50 hover:shadow-lg')
        "
      >
        <p [class]="'text-lg font-semibold ' + (dark ? 'text-white' : 'text-black')">
          Tailwind CSS
        </p>
        <p [class]="'mt-2 text-sm ' + (dark ? 'text-slate-400' : 'text-black')">Utility-first UI</p>
      </div>

      <!-- Git & GitHub -->
      <div
        [class]="
          'rounded-2xl border p-6 transition hover:-translate-y-1 hover:border-cyan-400 ' +
          (dark
            ? 'border-white/10 bg-white/5 hover:shadow-none'
            : 'border-slate-200 bg-slate-50 hover:shadow-lg')
        "
      >
        <p [class]="'text-lg font-semibold ' + (dark ? 'text-white' : 'text-black')">
          Git & GitHub
        </p>
        <p [class]="'mt-2 text-sm ' + (dark ? 'text-slate-400' : 'text-black')">
          Version Control & Collaboration
        </p>
      </div>
    </div>
  </div>
</section>
