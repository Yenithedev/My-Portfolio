<section id="contact" [class]="'border-t ' + (dark ? 'border-white/10' : 'border-slate-200')">
  <div class="mx-auto max-w-4xl px-6 py-28 text-center">
    <p
      [class]="
        'font-mono text-sm uppercase tracking-widest ' + (dark ? 'text-cyan-400' : 'text-cyan-600')
      "
    >
      Get In Touch
    </p>

    <h2 [class]="'mt-4 text-4xl font-bold sm:text-5xl ' + (dark ? 'text-white' : 'text-black')">
      Let's build something great.
    </h2>

    <p
      [class]="
        'mx-auto mt-6 max-w-xl text-lg leading-relaxed ' + (dark ? 'text-slate-400' : 'text-black')
      "
    >
      I'm always interested in learning, building and working on interesting projects. If you'd like
      to work together, feel free to reach out.
    </p>

    <a
      href="mailto:adeyenisalau@gmail.com"
      [class]="
        'mt-8 inline-block rounded-full px-8 py-3 font-semibold transition ' +
        (dark
          ? 'bg-cyan-400 text-slate-950 hover:bg-cyan-300'
          : 'bg-cyan-500 text-white hover:bg-cyan-600')
      "
    >
      Say Hello
    </a>
  </div>
</section>
