<section class="mx-auto grid min-h-[85vh] max-w-6xl items-center gap-12 px-6 py-20 md:grid-cols-2">
  <!-- Hero Content -->
  <div>
    <p
      [class]="
        'mb-5 font-mono text-sm uppercase tracking-[0.25em] ' +
        (dark ? 'text-cyan-400' : 'text-cyan-600')
      "
    >
      Frontend Developer
    </p>

    <h1
      [class]="
        'text-5xl font-bold leading-tight tracking-tight sm:text-6xl lg:text-7xl ' +
        (dark ? 'text-white' : 'text-slate-900')
      "
    >
      I build
      <span [class]="dark ? 'text-cyan-400' : 'text-cyan-500'"> modern </span>
      web experiences.
    </h1>

    <p
      [class]="
        'mt-6 max-w-xl text-lg leading-relaxed ' + (dark ? 'text-slate-400' : 'text-slate-600')
      "
    >
      I'm a frontend developer focused on creating responsive, accessible and user-friendly web
      applications with Angular and modern web technologies.
    </p>

    <!-- Buttons -->
    <div class="mt-8 flex flex-wrap gap-4">
      <a
        href="#projects"
        [class]="
          'rounded-full px-7 py-3 font-semibold transition ' +
          (dark
            ? 'bg-cyan-400 text-slate-950 hover:bg-cyan-300'
            : 'bg-cyan-500 text-white hover:bg-cyan-600')
        "
      >
        View My Work
      </a>

      <a
        href="#contact"
        [class]="
          'rounded-full border px-7 py-3 font-semibold transition ' +
          (dark
            ? 'border-white/20 text-white hover:border-cyan-400 hover:text-cyan-400'
            : 'border-slate-300 text-slate-700 hover:border-cyan-500 hover:text-cyan-500')
        "
      >
        Let's Talk
      </a>
    </div>

    <!-- Social Links -->
    <div [class]="'mt-10 flex gap-5 text-sm ' + (dark ? 'text-slate-400' : 'text-slate-500')">
      <a
        href="https://github.com/Yenithedev"
        [class]="'transition ' + (dark ? 'hover:text-cyan-400' : 'hover:text-cyan-500')"
      >
        GitHub
      </a>

      <a
        href="https://www.linkedin.com/in/adeyeni-salau-423776237/"
        [class]="'transition ' + (dark ? 'hover:text-cyan-400' : 'hover:text-cyan-500')"
      >
        LinkedIn
      </a>
    </div>
  </div>

  <!-- Hero Visual -->
  <div class="flex justify-center">
    <div class="relative">
      <!-- Glow -->
      <div
        [class]="
          'absolute inset-0 rounded-full blur-3xl ' + (dark ? 'bg-cyan-400/20' : 'bg-cyan-400/10')
        "
      ></div>

      <!-- Developer Card -->
      <div
        [class]="
          'relative flex h-72 w-72 items-center justify-center rounded-3xl border shadow-xl backdrop-blur transition sm:h-96 sm:w-96 ' +
          (dark
            ? 'border-white/10 bg-white/5 shadow-none'
            : 'border-slate-200 bg-white shadow-2xl shadow-slate-300/60')
        "
      >
        <div class="text-center">
          <div
            [class]="
              'mx-auto mb-6 flex h-24 w-24 items-center justify-center rounded-full text-4xl font-bold ' +
              (dark ? 'bg-cyan-400 text-slate-950' : 'bg-cyan-500 text-white')
            "
          >
            <img
              class="rounded-full flex h-24 w-24 items-center justify-center"
              src="/images/yeni.jpeg"
              alt=""
            />
          </div>

          <p [class]="'text-xl font-semibold ' + (dark ? 'text-white' : 'text-slate-900')">
            Adeyeni Salau
          </p>

          <p [class]="'mt-2 font-mono text-sm ' + (dark ? 'text-cyan-400' : 'text-cyan-600')">
            Frontend Developer
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
