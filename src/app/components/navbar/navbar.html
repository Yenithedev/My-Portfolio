<header
  class="border-b border-slate-200 bg-white/80 backdrop-blur transition-colors duration-300 dark:border-white/10 dark:bg-slate-950/80"
>
  <nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-5">
    <!-- Logo -->
    <a href="#home" class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">
      YENITHEDEV<span class="text-cyan-500 dark:text-cyan-400">.</span>
    </a>

    <!-- Desktop Navigation -->
    <div class="hidden items-center gap-8 md:flex">
      <a
        href="#home"
        class="text-sm text-slate-600 transition hover:text-cyan-500 dark:text-slate-300 dark:hover:text-cyan-400"
      >
        Home
      </a>

      <a
        href="#about"
        class="text-sm text-slate-600 transition hover:text-cyan-500 dark:text-slate-300 dark:hover:text-cyan-400"
      >
        About
      </a>

      <a
        href="#skills"
        class="text-sm text-slate-600 transition hover:text-cyan-500 dark:text-slate-300 dark:hover:text-cyan-400"
      >
        Skills
      </a>

      <a
        href="#projects"
        class="text-sm text-slate-600 transition hover:text-cyan-500 dark:text-slate-300 dark:hover:text-cyan-400"
      >
        Projects
      </a>

      <a
        href="#contact"
        class="rounded-full border border-cyan-500/50 px-5 py-2 text-sm text-cyan-600 transition hover:bg-cyan-500 hover:text-white dark:border-cyan-400/50 dark:text-cyan-400 dark:hover:bg-cyan-400 dark:hover:text-slate-950"
      >
        Contact
      </a>

      <!-- Theme Toggle -->
      <button
        class="flex h-10 w-10 items-center justify-center rounded-full border border-slate-200 bg-slate-100 text-lg transition hover:border-cyan-500 hover:text-cyan-500 dark:border-white/10 dark:bg-white/5 dark:hover:border-cyan-400 dark:hover:text-cyan-400"
        aria-label="Toggle dark mode"
        (click)="onChangeBack()"
      >
        @if (dark) {
          <img src="/images/icon-sun.svg" alt="" />
        } @else {
          <img src="/images/icon-moon.svg" alt="" />
        }
      </button>
    </div>

    <!-- Mobile menu -->
    <div class="flex items-center gap-3 md:hidden">
      <!-- Theme Toggle -->
      <button
        (click)="onChangeBack()"
        class="flex h-10 w-10 items-center justify-center rounded-full border border-slate-200 bg-slate-100 text-lg dark:border-white/10 dark:bg-white/5"
      >
        @if (dark) {
          <img src="/images/icon-sun.svg" alt="" />
        } @else {
          <img src="/images/icon-moon.svg" alt="" />
        }
      </button>

      <button class="rounded-lg border border-slate-200 px-3 py-2 dark:border-white/10">☰</button>
    </div>
  </nav>
</header>
